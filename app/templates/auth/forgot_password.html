{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow">
  <div class="card-header bg-primary text-white"><h1 class="h4 mb-0">Forgot password</h1></div>
  <div class="card-body">
    <p>Enter your patient account email or phone number. If the account can receive email, we will send a reset link.</p>
    <form method="POST">
      <label class="form-label" for="identifier">Email or phone</label>
      <input class="form-control mb-3" id="identifier" name="identifier" required autofocus>
      <button class="btn btn-primary w-100" type="submit">Send reset link</button>
    </form>
  </div>
</div></div></div>
{% endblock %}
