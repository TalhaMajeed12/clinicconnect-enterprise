{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-sign-in-alt"></i> {{ t('patient_login') }}</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i> 
                        <strong>{{ t('note') }}:</strong> {{ t('account_note') }}
                    </div>
                    
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label class="form-label">{{ t('email_or_phone') }}</label>
                            <input type="text" class="form-control" name="identifier" placeholder="Enter your email or phone" value="{{ request.form.get('identifier', '') }}" required autofocus>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">{{ t('password') }}</label>
                            <input type="password" class="form-control" name="password" placeholder="{{ t('enter_password') }}" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-sign-in-alt"></i> {{ t('login') }}
                        </button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="{{ url_for('auth.forgot_password') }}">{{ t('forgot_password') }}</a>
                    </div>
                    
                    <div class="mt-3 text-center">
                        <a href="{{ url_for('auth.clinician_login') }}" class="text-decoration-none">
                            <i class="fas fa-user-md"></i> {{ t('clinician_login') }}
                        </a>
                        <span class="mx-2">|</span>
                        <a href="{{ url_for('auth.admin_login') }}" class="text-decoration-none">
                            <i class="fas fa-user-shield"></i> {{ t('admin_login') }}
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
