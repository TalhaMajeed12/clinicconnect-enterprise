{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow">
  <div class="card-header bg-primary text-white"><h1 class="h4 mb-0">Reset password</h1></div>
  <div class="card-body">
    <form method="POST">
      <label class="form-label" for="password">New password</label>
      <input class="form-control mb-3" type="password" id="password" name="password" minlength="8" required>
      <label class="form-label" for="confirm_password">Confirm new password</label>
      <input class="form-control mb-3" type="password" id="confirm_password" name="confirm_password" minlength="8" required>
      <button class="btn btn-primary w-100" type="submit">Reset password</button>
    </form>
  </div>
</div></div></div>
{% endblock %}
